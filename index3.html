<!DOCTYPE html>
<html>
<head>
    <title>Table Layout</title>
    <style>
        table{
            border-collapse: collapse;
            width: 100%;
            height: 700px;
        }
        td{
            border: 3px solid black;
        }

        .inner{
            width: 90%;
            height: 80%;
            margin: auto;
            border-collapse: collapse;
        }

        .inner td{
            border: 3px solid black;
        }
    </style>
</head>
<body>

<table>

    <!-- Row 1 -->
    <tr height="120">
        <td colspan="2"></td>
        <td></td>
        <td></td>
        <td></td>
    </tr>

    <!-- Row 2 -->
    <tr height="220">
        <td colspan="2">
            <table class="inner">
                <tr>
                    <td></td>
                </tr>
            </table>
        </td>

        <td></td>
        <td></td>
        <td></td>
    </tr>

    <!-- Row 3 -->
    <tr height="120">
        <td colspan="2"></td>
        <td colspan="2"></td>

        <td rowspan="2">
            <table class="inner">
                <tr>
                    <td style="width:40%;"></td>
                    <td></td>
                </tr>
                <tr>
                    <td></td>
                    <td></td>
                </tr>
            </table>
        </td>
    </tr>

    <!-- Row 4 -->
    <tr height="140">
        <td colspan="2"></td>
        <td></td>
        <td></td>
    </tr>

</table>

</body>
</html>
